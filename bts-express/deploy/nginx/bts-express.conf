# /etc/nginx/conf.d/bts-express.conf
# nginx - tashqi dunyo uchun "eshik": 80/443 portni o'zi tinglaydi, ilovaga (127.0.0.1:8000) uzatadi.
# Ilovaning o'zi tashqaridan ko'rinmaydi.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 8m;            # fayl yuklash (5 MB + base64 ustama)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /api/login {
        limit_req zone=login burst=5 nodelay;      # parol terib buzishga qarshi
        include /etc/nginx/bts-proxy.inc;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/bts-proxy.inc;
    }
    location / {
        include /etc/nginx/bts-proxy.inc;
    }
}
